services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes: ["busgo_staging_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["6380:6379"]
    volumes: ["busgo_staging_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      auth-service: { condition: service_started }
      booking-service: { condition: service_started }
      operator-service: { condition: service_started }
      tracking-service: { condition: service_started }
    ports: ["4000:4000"]
    environment:
      NODE_ENV: staging
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4100
      BOOKING_SERVICE_URL: http://booking-service:4200
      OPERATOR_SERVICE_URL: http://operator-service:4600
      SEARCH_SERVICE_URL: http://search-service:4300
      TRACKING_SERVICE_URL: http://tracking-service:4400
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4700
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    command: npm --workspace api-gateway run start

  auth-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: staging
      PORT: 4100
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    command: npm --workspace auth-service run start

  booking-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: staging
      PORT: 4200
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      KAFKA_ENABLED: ${KAFKA_ENABLED}
    command: npm --workspace booking-service run start

  operator-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: staging
      PORT: 4600
      DATABASE_URL: ${DATABASE_URL}
      OPERATOR_DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      OTP_VERIFY_REQUIRED: ${OTP_VERIFY_REQUIRED}
    command: npm --workspace operator-service run start

  tracking-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: staging
      PORT: 4400
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TRACKING_DEVICE_KEY: ${TRACKING_DEVICE_KEY}
    command: npm --workspace tracking-service run start

  notification-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL}
      SMS_PROVIDER: CONSOLE
      EMAIL_PROVIDER: CONSOLE
      WHATSAPP_PROVIDER: CONSOLE
    command: npm --workspace notification-service run start

  whatsapp-service:
    build:
      context: ../backend/services
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["whatsapp"]
    env_file: .env.staging
    depends_on:
      postgres: { condition: service_healthy }
      booking-service: { condition: service_started }
    environment:
      NODE_ENV: staging
      PORT: 4700
      DATABASE_URL: ${DATABASE_URL}
      BOOKING_SERVICE_URL: http://booking-service:4200
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_PAYMENT_BASE_URL: ${WHATSAPP_PAYMENT_BASE_URL}
      WHATSAPP_CUSTOMER_APP_BASE_URL: ${WHATSAPP_CUSTOMER_APP_BASE_URL}
      WHATSAPP_TRACK_BASE_URL: ${WHATSAPP_TRACK_BASE_URL}
    command: npm --workspace whatsapp-service run start

  # search-service intentionally omitted from default staging startup because
  # current search projection requires Mongo/Kafka. Customer trip search already
  # has the SQL/operator search path used by the booking UI. Enable it separately
  # only when Mongo/Kafka projection infrastructure is configured.

volumes:
  busgo_staging_postgres:
  busgo_staging_redis:
