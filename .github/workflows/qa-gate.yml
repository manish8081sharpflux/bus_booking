name: BusGo QA Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  automated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production source scan
        run: npm run production:check
      - name: Automated QA contracts and simulations
        run: npm --workspace @busgo/qa test
      - name: Existing unit and integration tests
        run: npm test
      - name: Type checks
        run: npm run typecheck
      - name: Production builds
        run: npm run build

  staging-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.STAGING_BASE_URL != '' }}
    needs: automated-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace @busgo/qa run test:e2e
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
